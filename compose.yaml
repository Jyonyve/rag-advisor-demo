services:
 postgres:
  image: pgvector/pgvector:pg17
  environment:
   POSTGRES_DB: rag_advisor_demo
   POSTGRES_USER: advisor
   POSTGRES_PASSWORD: advisor
  ports:
   - '5432:5432'
  healthcheck:
   test: ['CMD-SHELL', 'pg_isready -U advisor -d rag_advisor_demo']
   interval: 5s
   timeout: 5s
   retries: 10
  volumes:
   - postgres-data:/var/lib/postgresql/data
 supertokens:
  image: supertokens/supertokens-postgresql:latest
  depends_on:
   postgres:
    condition: service_healthy
  environment:
   POSTGRESQL_CONNECTION_URI: postgresql://advisor:advisor@postgres:5432/rag_advisor_demo
   POSTGRESQL_TABLE_NAMES_PREFIX: supertokens_
  ports:
   - '3567:3567'
  healthcheck:
   test: >
    bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 &&
    echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 &&
    cat <&3 | grep Hello'
   interval: 10s
   timeout: 5s
   retries: 10

volumes:
 postgres-data:
