name: CI

on:
 pull_request:
 push:
  branches:
   - main

jobs:
 build:
  runs-on: ubuntu-latest
  permissions:
   contents: read

  steps:
   - name: Checkout
     uses: actions/checkout@v5

   - name: Setup pnpm
     uses: pnpm/action-setup@v4
     with:
      version: 10.18.0
      run_install: false

   - name: Setup Node
     uses: actions/setup-node@v5
     with:
      node-version: 22
      cache: pnpm

   - name: Install dependencies
     run: pnpm install --frozen-lockfile

   - name: Check formatting
     run: pnpm format:check

   - name: Typecheck
     run: pnpm typecheck

   - name: Test
     run: pnpm test

   - name: Build shared
     run: pnpm build:shared

   - name: Build server
     run: pnpm build:server

   - name: Build client
     run: pnpm build:client
